name: release

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - run: bun run check
      - run: bun run lint

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build SvelteKit application
        run: bun run build

      - name: Transfer build artifacts to ISPmanager server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: 'build,drizzle,drizzle.config.ts,package.json,bun.lock'
          target: ${{ secrets.TARGET_DIR }}

      - name: Run migrations & restart PM2 on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Include standard Node, npm, bun, and PM2 directories in PATH
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:~/.bun/bin:/opt/node24/bin

            cd ${{ secrets.TARGET_DIR }}

            # 1. Install dependencies
            npm install || bun install

            # 2. Run database migrations
            npx drizzle-kit migrate || bun run db:migrate || npx drizzle-kit push --force

            # 3. Reload or start PM2 process
            pm2 reload ${{ secrets.PM2_APP_NAME }} || pm2 restart ${{ secrets.PM2_APP_NAME }} || pm2 start build/index.js --name ${{ secrets.PM2_APP_NAME }}
